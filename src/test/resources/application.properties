# Les tests de l'API parlent en HTTP sans login : starter de sécurité éteint, chaîne permissive (TestSansSecurite).
# SecuriteTest rallume le starter.
anode.security.enabled=false
# un contexte Spring par classe de test, tous gardés en cache : de petits pools, pour rester sous max_connections de Postgres
spring.datasource.hikari.maximum-pool-size=3
